# Standalone NILM production tree. This insert is the complete Cordis tree;
# it does not layer over dsh-base and does not load sdk-minimal.
# Environment-specific endpoints and credentials come from the profile patch
# or K8s Secret. No address or account is embedded here.

- insert:
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: NILM_DEEPSEEK_API_KEY
        defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
        streamIdleTimeoutMs: 172800000

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.NILM_SESSIONS_ROOT ?? dshHomePath('sessions')
        compression: none

    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    - id: nilm-context
      name: '@deepseek-ai/dsh-nilm-context'

    - id: nilm-source
      name: '@deepseek-ai/dsh-nilm-source'
      config:
        localMysql:
          host: !!js process.env.NILM_LOCAL_MYSQL_HOST
          port: !!js Number(process.env.NILM_LOCAL_MYSQL_PORT ?? 3306)
          user: !!js process.env.NILM_LOCAL_MYSQL_USER
          password: !!js process.env.NILM_LOCAL_MYSQL_PASSWORD
          database: !!js process.env.NILM_LOCAL_MYSQL_DATABASE
        upstreamMysql:
          host: !!js process.env.NILM_UPSTREAM_MYSQL_HOST
          port: !!js Number(process.env.NILM_UPSTREAM_MYSQL_PORT ?? 3306)
          user: !!js process.env.NILM_UPSTREAM_MYSQL_USER
          password: !!js process.env.NILM_UPSTREAM_MYSQL_PASSWORD
          database: !!js process.env.NILM_UPSTREAM_MYSQL_DATABASE
        tdengineHotUrl: !!js process.env.NILM_UPSTREAM_TDENGINE_HOT_URL
        tdengineStatsUrl: !!js process.env.NILM_UPSTREAM_TDENGINE_STATS_URL
        tdengineUser: !!js process.env.NILM_UPSTREAM_TDENGINE_USER
        tdenginePassword: !!js process.env.NILM_UPSTREAM_TDENGINE_PASSWORD
        coldProxyUrl: !!js process.env.NILM_COLD_PROXY_URL

    - id: nilm-assets
      name: '@deepseek-ai/dsh-nilm-assets'

    - id: nilm-timeseries
      name: '@deepseek-ai/dsh-nilm-timeseries'

    - id: nilm-tariff
      name: '@deepseek-ai/dsh-nilm-tariff'

    - id: nilm-analytics
      name: '@deepseek-ai/dsh-nilm-analytics'

    - id: nilm-safety
      name: '@deepseek-ai/dsh-nilm-safety'

    - id: nilm-prompt
      name: '@deepseek-ai/dsh-nilm-prompt'

    - id: nilm-tools
      name: '@deepseek-ai/dsh-nilm-tools'

    - id: nilm-sentinel
      name: '@deepseek-ai/dsh-nilm-sentinel'
      config:
        pollIntervalMs: !!js Number(process.env.NILM_SENTINEL_POLL_MS ?? 5000)
        energyIntervalMs: !!js Number(process.env.NILM_SENTINEL_ENERGY_MS ?? 60000)
        bucketMinutes: !!js Number(process.env.NILM_SENTINEL_BUCKET_MINUTES ?? 5)
        batchSize: !!js Number(process.env.NILM_SENTINEL_BATCH_SIZE ?? 200)
        escalateAfterWindows: !!js Number(process.env.NILM_SENTINEL_ESCALATE_WINDOWS ?? 3)
        maxAttempts: !!js Number(process.env.NILM_NOTIFY_MAX_ATTEMPTS ?? 5)
        templates: !!js JSON.parse(process.env.NILM_ALERT_TEMPLATES ?? '{}')
        nominalVoltageV: !!js Number(process.env.NILM_SENTINEL_NOMINAL_VOLTAGE ?? 220)

    - id: nilm-notify
      name: '@deepseek-ai/dsh-nilm-notify'
      config:
        pollIntervalMs: !!js Number(process.env.NILM_NOTIFY_POLL_MS ?? 2000)
        batchSize: !!js Number(process.env.NILM_NOTIFY_BATCH_SIZE ?? 20)
        leaseMs: !!js Number(process.env.NILM_NOTIFY_LEASE_MS ?? 60000)
        channelTimeoutMs: !!js Number(process.env.NILM_NOTIFY_CHANNEL_TIMEOUT_MS ?? 10000)
        retentionDays: !!js Number(process.env.NILM_NOTIFY_RETENTION_DAYS ?? 180)
        wxSubscribeUrl: !!js process.env.NILM_WX_SUBSCRIBE_URL
        wxSubscribeToken: !!js process.env.NILM_WX_SUBSCRIBE_TOKEN
        wxTemplateUrl: !!js process.env.NILM_WX_TEMPLATE_URL
        wxTemplateToken: !!js process.env.NILM_WX_TEMPLATE_TOKEN
        wecomWebhookUrl: !!js process.env.NILM_WECOM_WEBHOOK_URL
        wecomWebhookToken: !!js process.env.NILM_WECOM_WEBHOOK_TOKEN
        smsUrl: !!js process.env.NILM_SMS_URL
        smsToken: !!js process.env.NILM_SMS_TOKEN
        enrichProvider: !!js process.env.NILM_ENRICH_PROVIDER ?? 'deepseek-official'
        enrichModel: !!js process.env.NILM_ENRICH_MODEL
        enrichPromptVersion: !!js process.env.NILM_ENRICH_PROMPT_VERSION ?? 'alert-enrich-v1'
        enrichTimeoutMs: !!js Number(process.env.NILM_ENRICH_TIMEOUT_MS ?? 8000)
        enrichConcurrency: !!js Number(process.env.NILM_ENRICH_CONCURRENCY ?? 2)
        enrichCwd: !!js process.env.NILM_ENRICH_CWD ?? process.cwd()

    - id: nilm-scheduler
      name: '@deepseek-ai/dsh-nilm-scheduler'
      config:
        tickIntervalMs: !!js Number(process.env.NILM_SCHEDULER_TICK_MS ?? 60000)
        morningHour: !!js Number(process.env.NILM_SCHEDULER_MORNING_HOUR ?? 8)
        morningMinute: !!js Number(process.env.NILM_SCHEDULER_MORNING_MINUTE ?? 30)
        qualityHour: !!js Number(process.env.NILM_SCHEDULER_QUALITY_HOUR ?? 3)
        qualityMinute: !!js Number(process.env.NILM_SCHEDULER_QUALITY_MINUTE ?? 30)
        reportChannels: !!js JSON.parse(process.env.NILM_REPORT_CHANNELS ?? '["wx_subscribe"]')
        reportTemplates: !!js JSON.parse(process.env.NILM_REPORT_TEMPLATES ?? '{}')
        maxAttempts: !!js Number(process.env.NILM_NOTIFY_MAX_ATTEMPTS ?? 5)
        jobLeaseMs: !!js Number(process.env.NILM_SCHEDULER_JOB_LEASE_MS ?? 300000)
        jobRetryDelayMs: !!js Number(process.env.NILM_SCHEDULER_JOB_RETRY_MS ?? 300000)
        summaryTimeoutMs: !!js Number(process.env.NILM_SCHEDULER_SUMMARY_TIMEOUT_MS ?? 20000)
        summaryProvider: !!js process.env.NILM_SCHEDULER_SUMMARY_PROVIDER ?? 'deepseek-official'
        summaryModel: !!js process.env.NILM_SCHEDULER_SUMMARY_MODEL ?? process.env.NILM_ENRICH_MODEL
        summaryPromptVersion: !!js process.env.NILM_SCHEDULER_SUMMARY_PROMPT_VERSION ?? 'report-summary-v1'
        qualityMinimumCoverage: !!js Number(process.env.NILM_R08_MIN_COVERAGE ?? 0.95)
        qualityMaximumParentDeviation: !!js Number(process.env.NILM_R08_MAX_PARENT_DEVIATION ?? 0.01)
        qualityMaximumHotColdDeviation: !!js Number(process.env.NILM_R08_MAX_HOT_COLD_DEVIATION ?? 0.01)

    - id: nilm-service
      name: '@deepseek-ai/dsh-nilm-service'
      config:
        host: !!js process.env.NILM_SERVICE_HOST ?? '0.0.0.0'
        port: !!js Number(process.env.NILM_SERVICE_PORT ?? 8080)
        sessionCwd: !!js process.env.NILM_SESSION_CWD ?? process.cwd()
        sessionsRoot: !!js process.env.NILM_SESSIONS_ROOT
        shardIndex: !!js Number(process.env.NILM_SHARD_INDEX ?? process.env.NILM_POD_NAME?.split('-').at(-1) ?? 0)
        shardCount: !!js Number(process.env.NILM_SHARD_COUNT ?? 1)
        provider: !!js process.env.NILM_MODEL_PROVIDER ?? 'deepseek-official'
        model: !!js process.env.NILM_MODEL ?? 'deepseek-chat'
        reasoningModel: !!js process.env.NILM_REASONING_MODEL ?? 'deepseek-reasoner'
        signingSecrets: !!js JSON.parse(process.env.NILM_SIGNING_SECRETS ?? '{}')

    # Runs last: the registered tool surface may contain only nilm_* tools.
    # Any shell, file, web, MCP, or subagent
    # tool fails process startup.
    - id: nilm-tool-guard
      name: '@deepseek-ai/dsh-nilm-app'
