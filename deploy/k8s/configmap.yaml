# Non-secret deployment values for nilm-agent. Secrets are supplied by the
# nilm-secrets Secret; no credential belongs in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nilm-config
  namespace: nilm
data:
  # Must equal the StatefulSet replica count. Changing it remaps tenants, so
  # drain and migrate before rolling the new count out.
  NILM_SHARD_COUNT: "4"
  NILM_MODEL_PROVIDER: deepseek-official
  NILM_MODEL: deepseek-chat
  NILM_REASONING_MODEL: deepseek-reasoner
  NILM_SERVICE_PORT: "8080"
  NILM_AUDIT_QUEUE_SIZE: "1024"
  NILM_AUDIT_BATCH_SIZE: "64"
  NILM_SESSION_CWD: /data/sessions
  NILM_SENTINEL_POLL_MS: "5000"
  NILM_SENTINEL_ENERGY_MS: "60000"
  # Required by nilm-sentinel. Replace with the upstream tenant key before apply.
  NILM_SOURCE_TENANT_ID: "REPLACE_WITH_UPSTREAM_TENANT_ID"
  NILM_NOTIFY_POLL_MS: "2000"
  NILM_SCHEDULER_TICK_MS: "60000"
  NILM_R08_MIN_COVERAGE: "0.95"
