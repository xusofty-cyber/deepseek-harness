# Stable per-shard DNS consumed by the edge gateway:
#   nilm-agent-<shard>.nilm-agent-headless.nilm.svc.cluster.local:8080
# The Service deliberately has no cluster IP and is never load-balanced as a
# whole: the edge must resolve the shard selected by shardForTenant(). Only
# ready Pods are published, so a successor is unreachable until /readyz passes.
apiVersion: v1
kind: Service
metadata:
  name: nilm-agent-headless
  namespace: nilm
  labels:
    app.kubernetes.io/name: nilm-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nilm-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
