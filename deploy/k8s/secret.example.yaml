# Copy to a private Secret and replace every placeholder. Never commit a real
# signing secret, model key, database password, or channel token.
apiVersion: v1
kind: Secret
metadata:
  name: nilm-secrets
  namespace: nilm
type: Opaque
stringData:
  # JSON object keyed by tenant id. Each value must be at least 16 characters.
  NILM_SIGNING_SECRETS: '{"REPLACE_TENANT": "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"}'
  NILM_DEEPSEEK_API_KEY: REPLACE_WITH_PROVIDER_KEY
  NILM_LOCAL_MYSQL_HOST: REPLACE_WITH_HOST
  NILM_LOCAL_MYSQL_USER: REPLACE_WITH_USER
  NILM_LOCAL_MYSQL_PASSWORD: REPLACE_WITH_PASSWORD
  NILM_LOCAL_MYSQL_DATABASE: REPLACE_WITH_DATABASE
  NILM_UPSTREAM_MYSQL_HOST: REPLACE_WITH_HOST
  NILM_UPSTREAM_MYSQL_USER: REPLACE_WITH_USER
  NILM_UPSTREAM_MYSQL_PASSWORD: REPLACE_WITH_PASSWORD
  NILM_UPSTREAM_MYSQL_DATABASE: REPLACE_WITH_DATABASE
  NILM_UPSTREAM_TDENGINE_HOT_URL: REPLACE_WITH_URL
  NILM_UPSTREAM_TDENGINE_STATS_URL: REPLACE_WITH_URL
  NILM_UPSTREAM_TDENGINE_USER: REPLACE_WITH_USER
  NILM_UPSTREAM_TDENGINE_PASSWORD: REPLACE_WITH_PASSWORD
  NILM_COLD_PROXY_URL: REPLACE_WITH_URL
